[package]
name = "rigix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Unified facade and core runtime for the Rigix web framework"

[features]
default = ["macros"]
macros = ["dep:rigix-macros", "dep:serde", "dep:serde_json"]
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:clap",
    "dep:utoipa",
    "dep:utoipa-swagger-ui",
    "dep:serde",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-subscriber",
]
auth = [
    "dep:argon2",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
]
db = [
    "dep:sqlx",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
]
full = ["macros", "server", "auth", "db"]

[dependencies]
rigix-macros = { path = "../rigix-macros", version = "0.1.0", optional = true }

# Server dependencies (Native only)
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }

# Auth dependencies
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# DB dependencies
sqlx = { workspace = true, optional = true }

# Core dependencies (compatible with wasm32 / no-server)
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
