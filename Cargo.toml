[workspace]
resolver = "2"
members = [
    "crates/rigix",
    "crates/rigix-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rigix Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rigix-framework/rigix"
homepage = "https://github.com/rigix-framework/rigix"
readme = "README.md"
rust-version = "1.80"

[workspace.dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"

# Serialization & OpenAPI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "6.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }

# Server & HTTP Runtime
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }

# Auth & Cryptography
argon2 = "0.5"
rand = "0.8"

# Database & Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Diagnostics & Error Handling
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
